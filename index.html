<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novedades Sueldos</title>
<meta name="description" content="Agenda de novedades para liquidación de sueldos">
<meta name="theme-color" content="#c2410c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Novedades">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icons/icon.svg" alt="" width="28" height="28">
    <span>Novedades Sueldos</span>
  </div>
  <div class="periodo">
    <button class="icon-btn" id="prevMes" aria-label="Mes anterior">‹</button>
    <input type="month" id="periodo" aria-label="Período">
    <button class="icon-btn" id="nextMes" aria-label="Mes siguiente">›</button>
  </div>
  <button class="btn install" id="btnInstalar" hidden>Instalar</button>
</header>

<main id="view"></main>

<nav class="tabs" role="tablist">
  <button data-tab="control" class="active"><span>☑</span>Control</button>
  <button data-tab="novedades"><span>✎</span>Novedades</button>
  <button data-tab="fichas"><span>▦</span>Fichas</button>
  <button data-tab="empleados"><span>👥</span>Empleados</button>
  <button data-tab="notas"><span>🗒</span>Notas</button>
</nav>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
